[package]
name = "dex-agent"
version = "0.1.0"
description = "Dex - AI Coding Agent Desktop"
authors = ["you"]
edition = "2021"

[lib]
name = "dex_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: child webview ในหน้าต่างหลัก (browser pane)
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "sync", "io-util", "time"] }
regex = "1"
globset = "0.4"
keyring = { version = "3", features = ["windows-native", "apple-native"] }
ureq = "2"
html2text = "0.17.4"
url = "2"
base64 = "0.22"
include_dir = "0.7"

# เรียก DevTools protocol ของ WebView2 ใน browser pane — ต้องเป็นเวอร์ชันเดียวกับที่ wry ใช้
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
