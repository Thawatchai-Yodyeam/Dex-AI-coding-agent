name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # แอปรองรับ Windows อย่างเดียว (PowerShell, Credential Manager, taskkill)
    runs-on: windows-latest
    steps:
      # plugins/gdocx เป็น submodule ที่ include_dir! ฝังลงแอปตอนคอมไพล์ — ไม่ดึงมา = G-docx ว่างและเทสต์ของมันล้ม
      # G-docx เป็น repo private ซึ่ง GITHUB_TOKEN อ่านไม่ได้: ตั้ง secret SUBMODULE_TOKEN เป็น fine-grained PAT
      # ที่อ่าน (Contents: Read-only) ได้ทั้ง repo นี้และ G-docx — checkout ใช้ token ตัวเดียวกันกับทั้งสอง repo
      - uses: actions/checkout@v5
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # ต้อง build ก่อน cargo test — tauri::generate_context! ฝัง dist/ ตอนคอมไพล์
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib
